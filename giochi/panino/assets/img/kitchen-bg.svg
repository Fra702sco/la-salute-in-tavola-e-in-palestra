<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="70%" stop-color="#FFE8CC"/>
      <stop offset="100%" stop-color="#FFDBB5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#90CAF9"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFEBE9"/>
      <stop offset="100%" stop-color="#D7CCC8"/>
    </linearGradient>
    <linearGradient id="counter-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#E8E0D8"/>
    </linearGradient>
    <linearGradient id="curtain-l" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF9A9A"/>
      <stop offset="100%" stop-color="#E57373"/>
    </linearGradient>
    <linearGradient id="curtain-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF9A9A"/>
      <stop offset="100%" stop-color="#E57373"/>
    </linearGradient>
    <linearGradient id="jar-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
    <linearGradient id="bottle-oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="fridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
    <pattern id="tiles" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#FFE0B2"/>
      <rect x="0" y="0" width="19" height="19" rx="1" fill="#FFECB3" opacity="0.5"/>
      <rect x="21" y="0" width="19" height="19" rx="1" fill="#FFECB3" opacity="0.5"/>
      <rect x="0" y="21" width="19" height="19" rx="1" fill="#FFECB3" opacity="0.5"/>
      <rect x="21" y="21" width="19" height="19" rx="1" fill="#FFECB3" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Wall -->
  <rect width="1200" height="500" fill="url(#wall)"/>

  <!-- Tile backsplash -->
  <rect x="0" y="330" width="1200" height="90" fill="url(#tiles)" opacity="0.4"/>

  <!-- Window -->
  <g transform="translate(700,50)">
    <rect x="-6" y="-6" width="232" height="182" rx="6" fill="#795548"/>
    <rect width="220" height="170" rx="3" fill="url(#sky)"/>
    <!-- Clouds -->
    <g opacity="0.8">
      <circle cx="45" cy="45" r="18" fill="white"/>
      <circle cx="65" cy="38" r="22" fill="white"/>
      <circle cx="88" cy="45" r="16" fill="white"/>
      <circle cx="155" cy="60" r="14" fill="white"/>
      <circle cx="170" cy="55" r="18" fill="white"/>
      <circle cx="188" cy="62" r="12" fill="white"/>
    </g>
    <!-- Sun -->
    <circle cx="30" cy="28" r="16" fill="#FFF176" opacity="0.7"/>
    <!-- Window cross -->
    <line x1="110" y1="0" x2="110" y2="170" stroke="#795548" stroke-width="5"/>
    <line x1="0" y1="85" x2="220" y2="85" stroke="#795548" stroke-width="5"/>
    <!-- Windowsill -->
    <rect x="-12" y="170" width="244" height="14" rx="3" fill="#8D6E63"/>
    <!-- Curtain left -->
    <path d="M-6,-6 Q20,50 8,180 L-6,180Z" fill="url(#curtain-l)" opacity="0.6"/>
    <!-- Curtain right -->
    <path d="M226,-6 Q200,50 212,180 L226,180Z" fill="url(#curtain-r)" opacity="0.6"/>
    <!-- Curtain rod -->
    <rect x="-16" y="-12" width="252" height="6" rx="3" fill="#795548"/>
    <circle cx="-14" cy="-9" r="5" fill="#6D4C41"/>
    <circle cx="234" cy="-9" r="5" fill="#6D4C41"/>
  </g>

  <!-- Upper cabinets -->
  <g>
    <!-- Cabinet 1 -->
    <rect x="50" y="60" width="150" height="110" rx="6" fill="url(#cab)" stroke="#BCAAA4" stroke-width="2"/>
    <rect x="56" y="66" width="66" height="98" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <rect x="128" y="66" width="66" height="98" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <circle cx="116" cy="115" r="4" fill="#A1887F"/>
    <circle cx="134" cy="115" r="4" fill="#A1887F"/>

    <!-- Cabinet 2 -->
    <rect x="220" y="60" width="110" height="110" rx="6" fill="url(#cab)" stroke="#BCAAA4" stroke-width="2"/>
    <rect x="226" y="66" width="98" height="98" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <circle cx="275" cy="115" r="4" fill="#A1887F"/>

    <!-- Cabinet 3 -->
    <rect x="350" y="60" width="150" height="110" rx="6" fill="url(#cab)" stroke="#BCAAA4" stroke-width="2"/>
    <rect x="356" y="66" width="66" height="98" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <rect x="428" y="66" width="66" height="98" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <circle cx="416" cy="115" r="4" fill="#A1887F"/>
    <circle cx="434" cy="115" r="4" fill="#A1887F"/>
  </g>

  <!-- Open shelf with items -->
  <g transform="translate(550,140)">
    <!-- Shelf plank -->
    <rect x="-5" y="52" width="130" height="10" rx="3" fill="#8D6E63"/>
    <rect x="-5" y="52" width="130" height="3" rx="2" fill="#A1887F" opacity="0.5"/>
    <!-- Green jar -->
    <rect x="8" y="18" width="24" height="34" rx="5" fill="url(#jar-green)" stroke="#81C784" stroke-width="1"/>
    <rect x="10" y="13" width="20" height="8" rx="3" fill="#795548"/>
    <rect x="14" y="28" width="12" height="10" rx="2" fill="white" opacity="0.25"/>
    <!-- Oil bottle -->
    <rect x="48" y="12" width="18" height="40" rx="5" fill="url(#bottle-oil)" stroke="#FFC107" stroke-width="1"/>
    <rect x="52" y="4" width="10" height="12" rx="3" fill="#795548"/>
    <rect x="52" y="22" width="10" height="14" rx="2" fill="white" opacity="0.2"/>
    <!-- Red spice jar -->
    <rect x="82" y="24" width="20" height="28" rx="4" fill="#EF9A9A" stroke="#E57373" stroke-width="1"/>
    <rect x="84" y="19" width="16" height="8" rx="3" fill="#795548"/>
    <circle cx="92" cy="38" r="4" fill="white" opacity="0.25"/>
  </g>

  <!-- Wall clock -->
  <g transform="translate(160,220)">
    <circle r="34" fill="white" stroke="#795548" stroke-width="4"/>
    <circle r="30" fill="#FAFAFA"/>
    <!-- Hour markers -->
    <line x1="0" y1="-26" x2="0" y2="-22" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <line x1="13" y1="-22.5" x2="11" y2="-19" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22.5" y1="-13" x2="19" y2="-11" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="0" x2="22" y2="0" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <line x1="22.5" y1="13" x2="19" y2="11" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13" y1="22.5" x2="11" y2="19" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="26" x2="0" y2="22" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <line x1="-13" y1="22.5" x2="-11" y2="19" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-22.5" y1="13" x2="-19" y2="11" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-26" y1="0" x2="-22" y2="0" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22.5" y1="-13" x2="-19" y2="-11" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-13" y1="-22.5" x2="-11" y2="-19" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hour hand -->
    <line x1="0" y1="4" x2="-8" y2="-14" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="4" x2="2" y2="-22" stroke="#3E2723" stroke-width="2" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle r="3" fill="#E65100"/>
  </g>

  <!-- Fridge (right side) -->
  <g transform="translate(1020,120)">
    <rect width="140" height="300" rx="8" fill="url(#fridge)" stroke="#BDBDBD" stroke-width="2"/>
    <!-- Freezer door -->
    <rect x="6" y="6" width="128" height="90" rx="4" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
    <rect x="110" y="35" width="6" height="30" rx="3" fill="#BDBDBD"/>
    <!-- Fridge door -->
    <rect x="6" y="102" width="128" height="192" rx="4" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
    <rect x="110" y="160" width="6" height="50" rx="3" fill="#BDBDBD"/>
    <!-- Magnets -->
    <circle cx="30" cy="130" r="6" fill="#EF5350"/>
    <circle cx="50" cy="122" r="5" fill="#42A5F5"/>
    <rect x="62" y="128" width="18" height="12" rx="2" fill="#FFC107"/>
  </g>

  <!-- Counter / Lower cabinets -->
  <g>
    <!-- Counter top surface -->
    <rect x="0" y="410" width="1010" height="16" rx="2" fill="url(#counter-top)" stroke="#D7CCC8" stroke-width="1"/>
    <!-- Lower cabinet body -->
    <rect x="0" y="426" width="1010" height="120" fill="url(#cab)" stroke="#BCAAA4" stroke-width="1.5"/>
    <!-- Cabinet doors -->
    <rect x="20" y="436" width="120" height="100" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <circle cx="130" cy="486" r="4" fill="#A1887F"/>
    <rect x="160" y="436" width="120" height="100" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <circle cx="170" cy="486" r="4" fill="#A1887F"/>
    <!-- Drawer -->
    <rect x="300" y="436" width="160" height="44" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <rect x="365" y="454" width="30" height="6" rx="3" fill="#A1887F"/>
    <rect x="300" y="490" width="160" height="46" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <rect x="365" y="509" width="30" height="6" rx="3" fill="#A1887F"/>
    <!-- More doors -->
    <rect x="480" y="436" width="120" height="100" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <circle cx="590" cy="486" r="4" fill="#A1887F"/>
    <rect x="620" y="436" width="120" height="100" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <circle cx="630" cy="486" r="4" fill="#A1887F"/>
    <!-- Sink area -->
    <rect x="760" y="436" width="230" height="100" rx="4" fill="none" stroke="#C8B9AE" stroke-width="1.5"/>
    <ellipse cx="875" cy="414" rx="40" ry="6" fill="#BDBDBD"/>
    <rect x="870" y="395" width="10" height="22" rx="3" fill="#9E9E9E"/>
    <rect x="863" y="390" width="24" height="8" rx="4" fill="#BDBDBD"/>
  </g>

  <!-- Items on counter -->
  <g>
    <!-- Cutting board -->
    <rect x="100" y="388" width="70" height="24" rx="6" fill="#D7CCC8" stroke="#BCAAA4" stroke-width="1"/>
    <rect x="106" y="392" width="58" height="16" rx="4" fill="#EFEBE9"/>
    <!-- Fruit bowl -->
    <g transform="translate(250,380)">
      <path d="M-25,30 Q-28,10 0,8 Q28,10 25,30Z" fill="#EFEBE9" stroke="#D7CCC8" stroke-width="1.5"/>
      <circle cx="-8" cy="4" r="10" fill="#EF5350"/>
      <circle cx="-8" cy="4" r="10" fill="none" stroke="#E53935" stroke-width="0.5"/>
      <circle cx="8" cy="2" r="9" fill="#FFA726"/>
      <circle cx="8" cy="2" r="9" fill="none" stroke="#F57C00" stroke-width="0.5"/>
      <ellipse cx="0" cy="-4" rx="7" ry="6" fill="#FFEE58"/>
      <path d="M-1,-7 L0,-10" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Potted herb -->
    <g transform="translate(500,370)">
      <rect x="-14" y="18" width="28" height="24" rx="3" fill="#A1887F" stroke="#8D6E63" stroke-width="1"/>
      <rect x="-10" y="16" width="20" height="4" rx="2" fill="#8D6E63"/>
      <ellipse cx="0" cy="18" rx="14" ry="4" fill="#795548"/>
      <path d="M0,16 Q-6,4 -12,-2" stroke="#4CAF50" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M0,16 Q2,2 0,-6" stroke="#66BB6A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M0,16 Q8,6 14,0" stroke="#4CAF50" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="-12" cy="-4" rx="6" ry="4" fill="#66BB6A"/>
      <ellipse cx="0" cy="-8" rx="5" ry="4" fill="#81C784"/>
      <ellipse cx="14" cy="-2" rx="6" ry="4" fill="#66BB6A"/>
    </g>
  </g>

  <!-- Hanging utensils -->
  <g transform="translate(400,180)" opacity="0.5">
    <!-- Rail -->
    <rect x="-10" y="0" width="120" height="4" rx="2" fill="#9E9E9E"/>
    <!-- Ladle -->
    <line x1="10" y1="4" x2="10" y2="40" stroke="#BDBDBD" stroke-width="2.5"/>
    <ellipse cx="10" cy="46" rx="9" ry="5" fill="none" stroke="#BDBDBD" stroke-width="2.5"/>
    <!-- Spatula -->
    <line x1="40" y1="4" x2="40" y2="35" stroke="#BDBDBD" stroke-width="2.5"/>
    <rect x="34" y="35" width="12" height="16" rx="2" fill="#BDBDBD"/>
    <!-- Whisk -->
    <line x1="70" y1="4" x2="70" y2="32" stroke="#BDBDBD" stroke-width="2.5"/>
    <ellipse cx="70" cy="40" rx="6" ry="10" fill="none" stroke="#BDBDBD" stroke-width="2"/>
    <!-- Hook -->
    <line x1="100" y1="4" x2="100" y2="38" stroke="#BDBDBD" stroke-width="2.5"/>
    <path d="M94,38 Q100,48 106,38" stroke="#BDBDBD" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="546" width="1200" height="254" fill="url(#floor)"/>
  <!-- Floor plank lines -->
  <g stroke="#795548" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="590" x2="1200" y2="590"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="690" x2="1200" y2="690"/>
    <line x1="0" y1="740" x2="1200" y2="740"/>
    <!-- Vertical gaps row 1 -->
    <line x1="150" y1="546" x2="150" y2="590"/>
    <line x1="380" y1="546" x2="380" y2="590"/>
    <line x1="600" y1="546" x2="600" y2="590"/>
    <line x1="830" y1="546" x2="830" y2="590"/>
    <line x1="1060" y1="546" x2="1060" y2="590"/>
    <!-- Vertical gaps row 2 offset -->
    <line x1="80" y1="590" x2="80" y2="640"/>
    <line x1="300" y1="590" x2="300" y2="640"/>
    <line x1="520" y1="590" x2="520" y2="640"/>
    <line x1="750" y1="590" x2="750" y2="640"/>
    <line x1="970" y1="590" x2="970" y2="640"/>
    <!-- Vertical gaps row 3 -->
    <line x1="200" y1="640" x2="200" y2="690"/>
    <line x1="430" y1="640" x2="430" y2="690"/>
    <line x1="660" y1="640" x2="660" y2="690"/>
    <line x1="880" y1="640" x2="880" y2="690"/>
    <line x1="1100" y1="640" x2="1100" y2="690"/>
    <!-- Vertical gaps row 4 offset -->
    <line x1="100" y1="690" x2="100" y2="740"/>
    <line x1="340" y1="690" x2="340" y2="740"/>
    <line x1="570" y1="690" x2="570" y2="740"/>
    <line x1="800" y1="690" x2="800" y2="740"/>
    <line x1="1030" y1="690" x2="1030" y2="740"/>
  </g>
  <!-- Floor highlight -->
  <rect x="0" y="546" width="1200" height="4" fill="white" opacity="0.06"/>

  <!-- Baseboard -->
  <rect x="0" y="540" width="1200" height="8" fill="#795548"/>
</svg>
