<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <defs>
    <linearGradient id="bread-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8B960"/>
      <stop offset="40%" stop-color="#D4A04A"/>
      <stop offset="100%" stop-color="#C4903A"/>
    </linearGradient>
    <linearGradient id="bread-bot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A04A"/>
      <stop offset="100%" stop-color="#C08530"/>
    </linearGradient>
    <linearGradient id="lettuce-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
    <linearGradient id="tomato-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="cheese-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
  </defs>

  <!-- Ombra -->
  <ellipse cx="120" cy="192" rx="90" ry="8" fill="rgba(0,0,0,0.1)"/>

  <!-- Pane sotto -->
  <path d="M30,150 Q30,140 40,135 L200,135 Q210,140 210,150 L210,165 Q210,175 200,175 L40,175 Q30,175 30,165 Z" fill="url(#bread-bot)"/>
  <path d="M30,150 Q30,140 40,135 L200,135 Q210,140 210,150" fill="none" stroke="#A0722A" stroke-width="1"/>

  <!-- Lattuga (bordi ondulati che sporgono) -->
  <path d="M24,130 Q40,120 60,132 Q80,120 100,132 Q120,120 140,132 Q160,120 180,132 Q200,120 216,130 L210,140 Q190,132 170,140 Q150,132 130,140 Q110,132 90,140 Q70,132 50,140 L30,140 Z" fill="url(#lettuce-g)"/>
  <path d="M24,130 Q40,120 60,132 Q80,120 100,132 Q120,120 140,132 Q160,120 180,132 Q200,120 216,130" fill="none" stroke="#2E7D32" stroke-width="1"/>

  <!-- Fette di pomodoro -->
  <circle cx="65" cy="118" r="18" fill="url(#tomato-g)"/>
  <circle cx="65" cy="118" r="18" fill="none" stroke="#B71C1C" stroke-width="0.8"/>
  <circle cx="65" cy="118" r="6" fill="rgba(255,205,210,0.5)"/>
  <path d="M53,118 L65,112 L77,118 L65,124 Z" stroke="rgba(183,28,28,0.2)" stroke-width="0.5" fill="none"/>

  <circle cx="115" cy="115" r="18" fill="url(#tomato-g)"/>
  <circle cx="115" cy="115" r="18" fill="none" stroke="#B71C1C" stroke-width="0.8"/>
  <circle cx="115" cy="115" r="6" fill="rgba(255,205,210,0.5)"/>
  <path d="M103,115 L115,109 L127,115 L115,121 Z" stroke="rgba(183,28,28,0.2)" stroke-width="0.5" fill="none"/>

  <circle cx="170" cy="118" r="18" fill="url(#tomato-g)"/>
  <circle cx="170" cy="118" r="18" fill="none" stroke="#B71C1C" stroke-width="0.8"/>
  <circle cx="170" cy="118" r="6" fill="rgba(255,205,210,0.5)"/>

  <!-- Formaggio -->
  <path d="M35,100 L45,108 L205,108 L210,100 L195,96 L45,96 Z" fill="url(#cheese-g)"/>
  <path d="M35,100 L45,108 L205,108 L210,100" fill="none" stroke="#F9A825" stroke-width="0.8"/>
  <!-- Triangolo che sporge -->
  <path d="M185,96 L200,84 L210,100" fill="#FFD54F" stroke="#F9A825" stroke-width="0.8"/>

  <!-- Prosciutto / affettato -->
  <path d="M32,88 Q60,78 120,82 Q180,78 208,88 Q210,94 208,96 Q180,86 120,90 Q60,86 32,96 Q30,94 32,88 Z" fill="#F48FB1"/>
  <path d="M32,88 Q60,78 120,82 Q180,78 208,88" fill="none" stroke="#E91E63" stroke-width="0.8"/>
  <ellipse cx="80" cy="86" rx="8" ry="4" fill="rgba(255,255,255,0.15)"/>
  <ellipse cx="150" cy="85" rx="6" ry="3" fill="rgba(255,255,255,0.12)"/>

  <!-- Uovo sodo a fette -->
  <ellipse cx="75" cy="76" rx="16" ry="10" fill="#FFFDE7" stroke="#E0D8A0" stroke-width="0.8"/>
  <ellipse cx="75" cy="76" rx="7" ry="5" fill="#FFD54F"/>
  <ellipse cx="145" cy="74" rx="16" ry="10" fill="#FFFDE7" stroke="#E0D8A0" stroke-width="0.8"/>
  <ellipse cx="145" cy="74" rx="7" ry="5" fill="#FFD54F"/>

  <!-- Pane sopra (cupola) -->
  <path d="M30,72 Q30,20 120,15 Q210,20 210,72 L210,78 Q210,82 200,82 L40,82 Q30,82 30,78 Z" fill="url(#bread-top)"/>
  <path d="M30,72 Q30,20 120,15 Q210,20 210,72" fill="none" stroke="#A0722A" stroke-width="1.2"/>

  <!-- Riflesso sul pane -->
  <path d="M70,35 Q100,22 160,30 Q130,25 70,35 Z" fill="rgba(255,255,255,0.2)"/>

  <!-- Semi di sesamo -->
  <ellipse cx="80" cy="40" rx="4" ry="2.5" fill="#F5E6C8" transform="rotate(-15 80 40)"/>
  <ellipse cx="110" cy="30" rx="4" ry="2.5" fill="#F5E6C8" transform="rotate(10 110 30)"/>
  <ellipse cx="140" cy="35" rx="4" ry="2.5" fill="#F5E6C8" transform="rotate(-5 140 35)"/>
  <ellipse cx="155" cy="50" rx="4" ry="2.5" fill="#F5E6C8" transform="rotate(20 155 50)"/>
  <ellipse cx="95" cy="55" rx="4" ry="2.5" fill="#F5E6C8" transform="rotate(-10 95 55)"/>
  <ellipse cx="65" cy="55" rx="4" ry="2.5" fill="#F5E6C8" transform="rotate(5 65 55)"/>
  <ellipse cx="170" cy="62" rx="3.5" ry="2" fill="#F5E6C8" transform="rotate(-8 170 62)"/>
</svg>